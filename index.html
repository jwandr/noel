<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N.O.E.L. | National Office of Emoji Liaison</title>
<style>
:root {
  --navy:#102f2b; --gold:#d2b27d; --ivory:#f3eee4;
  --slate:#19423b; --muted:#b0bdb7; --green:#719b7d;
  --red:#b66e64; --folder:#d8c49d; --folder-ink:#263b32;
  --folder-edge:#bba77f;
}
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; background:var(--navy); color:var(--ivory); font-family:"Avenir Next",Avenir,"Segoe UI",Helvetica,Arial,sans-serif; }
button,input { font:inherit; }
button { cursor:pointer; }
button:focus-visible,input:focus-visible { outline:2px solid var(--gold); outline-offset:3px; }
.hidden { display:none!important; }
.shell { max-width:1100px; margin:auto; padding:24px; }
header { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:15px 0 24px; border-bottom:1px solid #d2b27d55; margin-bottom:32px; }
.brand { display:flex; align-items:center; gap:13px; }
.brand img { width:52px; height:52px; object-fit:contain; }
.brand-mark { width:52px; height:52px; border:1px solid var(--gold); display:grid; place-items:center; color:var(--gold); font-size:23px; border-radius:14px; }
.brand-name { letter-spacing:3px; font-size:20px; color:var(--gold); }
.brand-sub { font-size:10px; letter-spacing:1.5px; color:var(--muted); }
.eyebrow { color:var(--gold); font-size:11px; letter-spacing:2.5px; text-transform:uppercase; }
h1,h2,h3 { font-family:inherit; font-weight:600; }
h1 { font-size:clamp(28px,5vw,38px); margin:10px 0 14px; }
h2 { font-size:27px; }
h3 { font-size:19px; }
p { line-height:1.65; color:#d6dce1; }
.small { font-size:12px; color:var(--muted); line-height:1.6; }
.gold { color:var(--gold); }
.btn { border:1px solid var(--gold); border-radius:8px; color:var(--navy); background:var(--gold); padding:13px 20px; letter-spacing:1px; text-transform:uppercase; font-size:11px; font-weight:700; transition:background .2s,transform .2s; }
.btn:hover { background:#e4c99d; transform:translateY(-1px); }
.btn.secondary { background:transparent; color:var(--gold); }
.btn.secondary:hover { background:#d2b27d18; }
.btn:disabled { opacity:.35; cursor:not-allowed; transform:none; }
.btn.small-btn { padding:9px 13px; font-size:10px; }
input { width:100%; padding:14px; border:1px solid #668666; border-radius:8px; background:var(--ivory); color:#17231f; margin:7px 0 18px; }
label { font-size:11px; letter-spacing:1.5px; color:var(--gold); text-transform:uppercase; }
.panel { background:var(--slate); border:1px solid #d2b27d55; border-radius:14px; padding:28px; margin:20px 0; }
.login-wrap { min-height:85vh; display:grid; place-items:center; }
.login-card { width:min(100%,600px); text-align:center; padding:38px; border:1px solid var(--gold); border-radius:14px; }
.login-logo { width:min(450px,100%); height:auto; max-height:450px; object-fit:contain; margin:10px auto; display:block; }
.login-fallback { width:150px; height:150px; border:2px solid var(--gold); display:grid; place-items:center; margin:10px auto 22px; color:var(--gold); font-size:34px; letter-spacing:4px; }
.login-card input { text-align:center; }
.login-card .btn { width:100%; }
.error { color:#efaaa3; font-size:13px; min-height:20px; }
.dashboard-intro { max-width:100%; }
.grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:24px 16px; padding-top:20px; }
/* Manila case folders */
.case { position:relative; isolation:isolate; overflow:visible; min-height:225px; margin-top:18px; padding:30px 25px 25px; cursor:pointer; color:var(--folder-ink); background:var(--folder); border:1px solid var(--folder-edge); border-radius:3px 12px 12px 12px; box-shadow:0 5px 12px #00000025,inset 0 1px 0 #ffffff66; transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease; }
.case:hover { transform:translateY(-3px); box-shadow:0 9px 22px #00000035; border-color:#8e7650; }
.case::before { content:"CLASSIFIED"; position:absolute; z-index:3; top:-20px; left:-1px; width:150px; height:21px; box-sizing:border-box; padding:4px 12px 3px; background:red; color:#fff5e9; border:1px solid #85332f; border-bottom:0; border-radius:5px 7px 0 0; font-size:9px; font-weight:800; letter-spacing:2px; text-align:center; }
.case-number { display:flex; align-items:center; justify-content:space-between; gap:8px; padding-bottom:10px; border-bottom:1px solid #bba77f; color:var(--folder-ink); font-size:14px; font-weight:700; letter-spacing:1.3px; line-height:1.6; text-transform:uppercase; }
.case-number::after { content:"E.L.F."; color:#765f3b; font-size:9px; letter-spacing:1px; }
.case-emoji { display:flex; justify-content:center; font-size:70px; margin:30px 0 9px; }
.case h2,.case h3,.case p,.case .case-status { color:var(--folder-ink); }
.case h3 { margin:5px 0 9px; letter-spacing:.3px; }
.case-status { font-size:10px; letter-spacing:1.5px; text-transform:uppercase; }
.case.done { border-color:#8d7449; }
.case.done::before { content:"FOUND" !important; background:#a9433d; }
.case-word { margin-top:17px; padding-top:12px; border-top:1px solid #bba77f; color:#263b32; font:bold 15px Arial,sans-serif; letter-spacing:2px; }
.case.done::after { content:""; position:absolute; z-index:4; top:50%; left:50%; width:275px; height:150px; background:url("found.png") center/contain no-repeat; transform:translate(-50%,-60%); opacity:.9; pointer-events:none; animation:stampArrival .45s ease-out; }
@keyframes stampArrival { 0%{opacity:0;transform:translate(-50%,-60%) scale(1.5)} 70%{opacity:1;transform:translate(-50%,-60%) scale(.95)} 100%{opacity:.9;transform:translate(-50%,-60%) scale(1)} }
.progress-wrap { margin:15px 0; }
.progress-track,.progress-fill { height:5px; }
.progress-track { background:#345a40; margin-top:10px; }
.progress-fill { background:var(--gold); width:0; transition:width .3s; }
.toolbar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:100px; }
.back { color:var(--gold); background:none; border:0; padding:8px 0; }
.phase { position:relative; background:#173b35; border:1px solid #526d5e; border-radius:14px; padding:25px; margin:18px 0; transition:border-color .25s ease; }
.phase.active { border-color:var(--gold); }
.phase.complete { border-color:var(--green); }
.phase.locked { opacity:.65; border-style:dashed; }
.phase-heading { display:flex; justify-content:space-between; align-items:center; gap:12px; }
.phase-number { color:var(--gold); font-size:9px; font-weight:700; letter-spacing:1.8px; }
.phase-heading h2 { margin:7px 0 0; font-size:25px; letter-spacing:1px; }
.phase-file-divider { height:1px; background:#d2b27d45; margin:19px 0; }
.phase-destination { color:var(--gold); font-size:10px; font-weight:700; letter-spacing:1.5px; }
.phase-status-indicator { display:flex; align-items:center; gap:8px; padding:8px 11px; border:1px solid; border-radius:6px; font-size:9px; font-weight:700; letter-spacing:1.2px; white-space:nowrap; }
.phase-status-icon { font-size:17px; line-height:1; }
.phase-status-indicator.active { color:var(--gold); border-color:var(--gold); background:#d2b27d12; }
.phase-status-indicator.locked { color:var(--muted); border-color:#71857b; background:#b0bdb710; }
.phase-status-indicator.completed { color:#a6d4b9; border-color:var(--green); background:#719b7d18; }
.answer-row { display:flex; gap:10px; }
.answer-row input { margin:0; }
.answer-row button { flex-shrink:0; }
.feedback { min-height:22px; font-size:13px; margin-top:12px; }
.feedback.good { color:#a6d4b9; }
.feedback.bad { color:#efaaa3; }
.reward { border:1px solid var(--gold); border-radius:14px; padding:25px; text-align:center; margin-top:25px; background:#173b35; }
.reward-word { font:bold 32px Arial,sans-serif; color:var(--gold); letter-spacing:4px; margin:15px; }
.experience { background:#204a3f; border-radius:10px; padding:14px; margin:10px 0; border-left:2px solid var(--gold); }
.experience strong { display:block; color:var(--gold); font-size:10px; letter-spacing:1.5px; margin-bottom:6px; }
.word-bank,.slots,.emoji-options { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:20px 0; }
.word { background:var(--gold); color:var(--navy); border:0; border-radius:9px; padding:14px 17px; font:bold 13px Arial,sans-serif; letter-spacing:1px; cursor:grab; }
.word:active { cursor:grabbing; }
.slot { width:105px; min-height:65px; border:1px dashed var(--gold); border-radius:10px; display:grid; place-items:center; padding:7px; color:var(--gold); background:#173b35; font:bold 12px Arial,sans-serif; text-align:center; }
.slot.filled { border-style:solid; background:#204a3f; }
.slot.locked { opacity:.35; border-color:#75808b; }
.slot small { color:var(--muted); font:9px Arial,sans-serif; }
.emoji-choice { font-size:33px; background:#173b35; border:1px solid #66866b; border-radius:12px; padding:13px 18px; }
.emoji-choice:hover { border-color:var(--gold); transform:scale(1.08); }
.emoji-choice.selected { border:2px solid var(--gold); background:#315b4b; }
.final-banner { text-align:center; padding:45px 20px; background:#173b35; border:1px solid var(--gold); border-radius:14px; }
.big-sheep { font-size:90px; margin:15px; }
.summary-case { border-bottom:1px solid #527453; padding:15px 0; }
.summary-case h3 { color:var(--gold); }
footer { margin-top:50px; padding:20px 0; border-top:1px solid #d2b27d44; color:var(--muted); font-size:10px; letter-spacing:1.5px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
#confetti { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:100; }
.confetti-piece { position:absolute; top:-20px; width:9px; height:15px; animation:fall 3.5s linear forwards; }
@keyframes fall { to { transform:translateY(110vh) rotate(900deg); opacity:0; } }
@media(max-width:750px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media(max-width:480px) {
  .shell { padding:15px; }
  .grid { grid-template-columns:1fr; gap:24px; }
  .case { min-height:170px; }
  .login-card { padding:24px; }
  .answer-row,.phase-heading { flex-direction:column; align-items:stretch; }
  .phase-status-indicator { align-self:flex-start; }
  .slot { width:85px; min-height:60px; }
  header { align-items:flex-start; }
  .case.done::after { width:145px; height:90px; }
}
.phase-grid {  display: grid;  grid-template-columns: repeat(2, minmax(0, 1fr));  gap: 18px;  align-items: start;}
@media (max-width: 750px) {  
  .phase-grid {    grid-template-columns: 1fr;  }
}
.phase-grid .phase {  height: 100%;}
.choice-grid {  display: grid;  grid-template-columns: repeat(2, minmax(0, 1fr));  gap: 10px;  margin-top: 12px;}
.choice-button {  width: 100%;  text-transform: none;  letter-spacing: 0;  font-size: 14px;  padding: 14px 10px;}
@media (max-width: 480px) {
  .choice-grid {    grid-template-columns: 1fr;  }
}
.evidence-image {  display: block;  width: 100%;  max-width: 420px;  height: auto;  margin: 18px auto;  border: 1px solid #d2b27d55;  border-radius: 10px;  background: #ffffff08;}
/* ============================================================
   N.O.E.L. LOGIN TRANSITION — INTELLIGENCE SYSTEM INITIALISATION
   ============================================================ */
.noel-boot {
  --boot-line:rgba(210,178,125,.28);
  min-height:calc(100vh - 150px);
  display:grid;
  place-items:center;
  padding:28px 0 44px;
  animation:bootFadeIn .55s ease both;
}
.boot-console {
  width:min(100%,900px);
  position:relative;
  overflow:hidden;
  padding:clamp(20px,4vw,38px);
  border:1px solid var(--gold);
  border-radius:14px;
  background:
    radial-gradient(ellipse at 50% 42%,rgba(113,155,125,.13),transparent 52%),
    linear-gradient(145deg,#153b34,#0d2925 72%);
  box-shadow:0 22px 70px #0005,inset 0 0 45px #0003;
}
.boot-console::before {
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.15;
  background:repeating-linear-gradient(0deg,transparent 0 3px,#d2b27d12 4px);
}
.boot-topline,.boot-bottomline {
  position:relative; display:flex; justify-content:space-between; gap:12px;
  flex-wrap:wrap; color:var(--muted); font:10px/1.5 "Courier New",monospace;
  letter-spacing:1.5px;
}
.boot-topline { padding-bottom:15px; border-bottom:1px solid var(--boot-line); }
.boot-heading { position:relative; text-align:center; margin:24px 0 12px; }
.boot-heading h1 {
  color:var(--gold); font:600 clamp(24px,4vw,34px)/1.2 "Courier New",monospace;
  letter-spacing:clamp(2px,1vw,5px); margin:8px 0 10px;
}
.boot-heading p { margin:0; color:#d6dcd1; font:11px/1.6 "Courier New",monospace; letter-spacing:1.5px; }
.boot-seal { color:var(--gold); font-size:25px; letter-spacing:5px; }
.boot-visuals {
  position:relative; display:grid; grid-template-columns:1fr 1fr 1fr;
  gap:14px; align-items:center; margin:24px 0;
}
.boot-module {
  min-width:0; min-height:190px; position:relative; overflow:hidden;
  border:1px solid var(--boot-line); border-radius:10px;
  background:#081e1b88; padding:13px;
}
.boot-module-title {
  color:var(--gold); font:10px "Courier New",monospace;
  letter-spacing:1.5px; text-align:center;
}
.boot-radar {
  width:min(100%,158px); aspect-ratio:1; margin:10px auto 0; position:relative;
  border:1px solid #719b7d80; border-radius:50%;
  background:repeating-radial-gradient(circle,transparent 0 20%,#719b7d32 20.5% 21%,transparent 21.5% 40%);
  overflow:hidden;
}
.boot-radar::before,.boot-radar::after {
  content:""; position:absolute; background:#719b7d55;
}
.boot-radar::before { width:1px; height:100%; left:50%; top:0; }
.boot-radar::after { height:1px; width:100%; top:50%; left:0; }
.radar-sweep {
  position:absolute; inset:0; border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0 72%,#719b7d05 78%,#a6d4b955 100%);
  animation:radarSpin 3.2s linear infinite;
}
.radar-blip {
  position:absolute; width:6px; height:6px; border-radius:50%;
  background:var(--gold); box-shadow:0 0 9px var(--gold);
  animation:blipPulse 1.6s ease-in-out infinite;
}
.radar-blip.one { left:65%; top:28%; }
.radar-blip.two { left:33%; top:62%; animation-delay:.5s; }
.radar-blip.three { left:73%; top:72%; animation-delay:1s; }
.boot-network { width:100%; height:155px; display:block; margin-top:5px; }
.network-line { stroke:#719b7d; stroke-width:1.3; stroke-dasharray:5 5; opacity:.7; animation:networkFlow 2s linear infinite; }
.network-node { fill:#d2b27d; stroke:#f3eee4; stroke-width:1; transform-box:fill-box; transform-origin:center; animation:nodePulse 1.8s ease-in-out infinite; }
.network-node:nth-of-type(2n) { animation-delay:.45s; }
.boot-files { display:grid; gap:8px; margin-top:14px; }
.boot-file {
  display:flex; justify-content:space-between; align-items:center; gap:5px;
  padding:8px 7px; border:1px solid #d2b27d44; border-radius:4px;
  color:#d9d4c7; font:9px "Courier New",monospace; letter-spacing:.7px;
  opacity:.28; transform:translateX(8px);
}
.boot-file.loaded { opacity:1; transform:translateX(0); border-color:#a6d4b9a0; background:#719b7d17; transition:all .35s ease; }
.boot-file .file-state { color:var(--gold); white-space:nowrap; }
.boot-status {
  position:relative; min-height:72px; margin:18px 0 15px; padding:14px 16px;
  border-left:2px solid var(--gold); background:#071c19a8;
  font:12px/1.7 "Courier New",monospace; color:#e5e0d5;
}
.boot-status-label { color:var(--gold); font-size:9px; letter-spacing:2px; margin-bottom:5px; }
.boot-message::after { content:""; display:inline-block; width:7px; height:13px; margin-left:5px; vertical-align:-2px; background:var(--gold); animation:cursorBlink .8s steps(2) infinite; }
.boot-progress-row { display:flex; justify-content:space-between; gap:10px; color:var(--muted); font:10px "Courier New",monospace; letter-spacing:1px; }
.boot-progress-track { height:7px; margin-top:9px; border:1px solid #719b7d70; background:#061b18; overflow:hidden; }
.boot-progress-fill { width:0; height:100%; background:linear-gradient(90deg,#719b7d,var(--gold)); box-shadow:0 0 12px #d2b27d66; transition:width .35s ease; }
.boot-bottomline { margin-top:19px; padding-top:13px; border-top:1px solid var(--boot-line); }
.boot-sound {
  position:relative; border:1px solid #d2b27d88; border-radius:6px;
  padding:8px 11px; background:transparent; color:var(--gold);
  font:10px "Courier New",monospace; letter-spacing:1px;
}
.boot-sound[aria-pressed="true"] { background:#d2b27d20; color:#fff0d2; }
.boot-auth { color:#a6d4b9; }
@keyframes bootFadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
@keyframes radarSpin { to{transform:rotate(360deg)} }
@keyframes blipPulse { 0%,100%{opacity:.45;transform:scale(.75)} 50%{opacity:1;transform:scale(1.35)} }
@keyframes networkFlow { to{stroke-dashoffset:-20} }
@keyframes nodePulse { 0%,100%{transform:scale(.8);opacity:.65} 50%{transform:scale(1.35);opacity:1} }
@keyframes cursorBlink { 50%{opacity:0} }
@media(max-width:650px) {
  .boot-visuals { grid-template-columns:1fr 1fr; }
  .boot-module:last-child { grid-column:1/-1; min-height:unset; }
  .boot-files { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .boot-file { font-size:8px; }
}
@media(max-width:420px) {
  .boot-visuals { grid-template-columns:1fr; }
  .boot-module:last-child { grid-column:auto; }
  .boot-module { min-height:175px; }
}
@media(prefers-reduced-motion:reduce) {
  .noel-boot,.radar-sweep,.radar-blip,.network-line,.network-node,.boot-message::after { animation:none!important; }
  .boot-progress-fill,.boot-file.loaded { transition:none!important; }
}
/* ---------- Boot exit + dashboard reveal ---------- */
.boot-console.boot-exit { animation: bootExit .8s ease-in forwards; }
@keyframes bootExit {
  0%   { opacity:1; transform:scale(1);    filter:brightness(1); }
  30%  { opacity:1; transform:scale(1.01); filter:brightness(1.8); }
  100% { opacity:0; transform:scale(1.06); filter:brightness(1) blur(6px); }
}
.boot-flash {
  position:fixed; inset:0; z-index:90; pointer-events:none; opacity:0;
  background:radial-gradient(circle at center,#d2b27d66,transparent 70%);
  animation:bootFlash .8s ease-out;
}
@keyframes bootFlash { 0%{opacity:0} 30%{opacity:1} 100%{opacity:0} }

/* "backwards" fill so hover transforms on case folders still work afterwards */
.reveal { animation:revealIn .6s cubic-bezier(.2,.7,.2,1) backwards; animation-delay:var(--d,0s); }
@keyframes revealIn {
  from { opacity:0; transform:translateY(18px); filter:blur(4px); }
  to   { opacity:1; transform:none; filter:none; }
}
@media(prefers-reduced-motion:reduce) {
  .reveal,.boot-console.boot-exit,.boot-flash { animation:none!important; }
}
</style>
</head>
<body>
<div id="confetti"></div>
<div class="shell">
  <header id="siteHeader" class="hidden">
    <div class="brand">
      <img id="headerLogo" src="noel-logo-small.png" alt="N.O.E.L. logo"

</div>
<script>
// ============================================================
// N.O.E.L. CONFIGURATION
// Change the content in this section as your Christmas mystery
// develops. The rest of the website uses this information.
// ============================================================
const CONFIG = {

      experiences: {

    {

      emoji: "🥐",

let noelSoundEnabled = true;          // ON by default
let noelAudioContext = null;
let noelMaster = null;

function getNoelAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!noelAudioContext) {
    noelAudioContext = new AC();
    const comp = noelAudioContext.createDynamicsCompressor();
    noelMaster = noelAudioContext.createGain();
    noelMaster.gain.value = 1.0;      // master volume
    noelMaster.connect(comp);
    comp.connect(noelAudioContext.destination);
  }
  if (noelAudioContext.state === "suspended") noelAudioContext.resume();
  return noelAudioContext;
}

// Digital blip: filtered square/saw with a quick upward pitch glide
function playNoelTone(frequency = 660, duration = 0.12, volume = 0.12, type = "square") {
  if (!noelSoundEnabled) return;
  try {
    const ctx = getNoelAudio(); if (!ctx) return;
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    const filter = ctx.createBiquadFilter();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(frequency, t);
    osc.frequency.exponentialRampToValueAtTime(frequency * 1.5, t + duration);
    filter.type = "lowpass"; filter.frequency.value = 3200;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(volume, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(filter); filter.connect(gain); gain.connect(noelMaster);
    osc.start(t); osc.stop(t + duration + 0.02);
  } catch (e) {}
}

// Whoosh: band-passed noise with a frequency sweep (rising or falling)
function playNoelWhoosh(duration = 0.9, rising = true, volume = 0.22) {
  if (!noelSoundEnabled) return;
  try {
    const ctx = getNoelAudio(); if (!ctx) return;
    const t = ctx.currentTime;
    const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * duration), ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = "bandpass"; filter.Q.value = 1.4;
    const [from, to] = rising ? [250, 5000] : [5000, 250];
    filter.frequency.setValueAtTime(from, t);
    filter.frequency.exponentialRampToValueAtTime(to, t + duration);
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(volume, t + duration * 0.45);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    src.connect(filter); filter.connect(gain); gain.connect(noelMaster);
    src.start(t);
  } catch (e) {}
}

// Quick digital arpeggio
function playNoelChirp(freqs = [880, 1175, 1568], gap = 65, volume = 0.09) {
  freqs.forEach((f, i) =>
    setTimeout(() => playNoelTone(f, 0.07, volume, "square"), i * gap));
}

// Low sub-bass boom for big moments
function playNoelBoom(volume = 0.4) {
  if (!noelSoundEnabled) return;
  try {
    const ctx = getNoelAudio(); if (!ctx) return;
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(110, t);
    osc.frequency.exponentialRampToValueAtTime(38, t + 0.9);
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.0);
    osc.connect(gain); gain.connect(noelMaster);
    osc.start(t); osc.stop(t + 1.05);
  } catch (e) {}
}

          Request an evidence hint
        </button>
        <div id="hint-${phase}" class="small"></div>
      `}
    </section>`;
  };
  showScreen(`
    <div class="toolbar">
      <button class="back" onclick="dashboard()">← BACK TO OPERATIONS</button>
    </div>
    <h1>${op.emoji} ${op.title}</h1>
    <p>${op.summary}</p>
    <div class="phase-grid">
      ${phaseHTML("lost", op.lost, op.experiences.lost, lostDone, false)}
      ${phaseHTML("found", op.found, op.experiences.found, foundDone, !lostDone)}
    </div>
    ${done ? `
      <section class="reward">
        <div class="eyebrow">OPERATION SUCCESSFULLY COMPLETED</div>
        <h2 class="gold">Emoji recovered.</h2>
        <p>The two destination experiences associated with this operation are now confirmed.</p>
        <div class="eyebrow">RECOVERED CODE WORD</div>
        <div class="reward-word">${op.codeWord}</div>
        <button class="btn" onclick="dashboard()">Return to operations</button>
      </section>
    ` : ""}
  `, "operation");
}
function normaliseAnswer(value) {
  return value.trim().toUpperCase().replace(/[.,!?]/g, "").replace(/\s+/g, " ");
}
function submitChoice(phase, selectedAnswer) {
  const op = currentOperation;
  const data = op[phase];
  const feedback = document.getElementById("feedback-" + phase);
  if (normaliseAnswer(selectedAnswer) === normaliseAnswer(data.answer)) {
    progress.phases[op.id + "-" + phase] = true;
    if (phase === "found") {
      progress.completed[op.id] = true;
    }
    saveProgress();
    renderOperation();
  } else {
    feedback.textContent = "That finding does not match the available evidence. Try again, Agent.";
    feedback.className = "feedback bad";
  }
}
function showHint(phase) {
  const op = currentOperation;
  document.getElementById("hint-" + phase).textContent =
    "EVIDENCE NOTE: " + op[phase].hint;
}
// ============================================================
// FINAL PUZZLE
// ============================================================
function finalPuzzle() {
  if (!allCasesDone()) return dashboard();
  // Start with words in a deliberately mixed order.
  const words = CONFIG.finalWords.slice();
  const shuffled = ["CHRISTMAS", "WANT", "ALL", "IS", "I", "FOR"];
  wordSlots = Array(7).fill(null);
  showScreen(`
    <div class="toolbar">
      <button class="back" onclick="dashboard()">← BACK TO OPERATIONS</button>
      <span class="eyebrow">CLASSIFICATION: FINAL</span>
    </div>
    <div class="eyebrow">FINAL INVESTIGATION // 001</div>
    <h1>The missing message.</h1>
    <p>All six cases have been resolved. Six words have been recovered, but their order remains uncertain.</p>
    <p>Arrange the words to reconstruct the message. There are seven positions, but the final position remains locked until the first six are correct.</p>
    <div class="panel">
      <div class="eyebrow">RECOVERED WORDS</div>
      <div id="wordBank" class="word-bank">
        ${shuffled.map((w, i) => `<button class="word" draggable="true"
          data-word="${w}" onclick="placeWord('${w}')"
          ondragstart="dragWord(event, '${w}')">${w}</button>`).join("")}
      </div>
      <div class="eyebrow" style="text-align:center">MESSAGE SEQUENCE</div>
      <div id="slots" class="slots">
        ${wordSlots.map((w, i) => slotHTML(i, w)).join("")}
      </div>
      <div id="finalFeedback" class="feedback" style="text-align:center"></div>
      <div style="text-align:center">
        <button class="btn" onclick="checkWordOrder()">Verify message</button>
        <button class="btn secondary" onclick="clearWordSlots()">Clear positions</button>
      </div>
    </div>
    <div id="emojiStage"></div>
  `, "final");
  updateWordBank();
}
function slotHTML(index, word) {
  const locked = index === 6 && !finalChecked;
  return `<div class="slot ${word ? "filled" : ""} ${locked ? "locked" : ""}"
    data-slot="${index}"
    ondragover="allowDrop(event)"
    ondrop="dropWord(event, ${index})"
    onclick="removeSlot(${index})">
    <small>${index + 1}</small>
    ${locked ? "🔒" : (word || "DROP WORD")}
  </div>`;
}
function updateWordBank() {
  const bank = document.getElementById("wordBank");
  if (!bank) return;
  const remaining = ["CHRISTMAS", "WANT", "ALL", "IS", "I", "FOR"]
    .filter(w => !wordSlots.includes(w));
  bank.innerHTML = remaining.map(w => `
    <button class="word" draggable="true" data-word="${w}"
      onclick="placeWord('${w}')" ondragstart="dragWord(event, '${w}')">${w}</button>
  `).join("");
  const slots = document.getElementById("slots");
  slots.innerHTML = wordSlots.map((w, i) => slotHTML(i, w)).join("");
}
function placeWord(word) {
  if (wordSlots.includes(word)) return;
  const empty = wordSlots.findIndex((v, i) => v === null && i < 6);
  if (empty === -1) return;
  wordSlots[empty] = word;
  updateWordBank();
}
function removeSlot(index) {
  if (index >= 6 || !wordSlots[index]) return;
  wordSlots[index] = null;
  finalChecked = false;
  updateWordBank();
  document.getElementById("emojiStage").innerHTML = "";
  document.getElementById("finalFeedback").textContent = "";
}
function clearWordSlots() {
  wordSlots = Array(7).fill(null);
  finalChecked = false;
  updateWordBank();
  document.getElementById("emojiStage").innerHTML = "";
  document.getElementById("finalFeedback").textContent = "";
}
function dragWord(event, word) {
  event.dataTransfer.setData("text/plain", word);
}
function allowDrop(event) {
  event.preventDefault();
}
function dropWord(event, index) {
  event.preventDefault();
  if (index === 6 && !finalChecked) return;
  const word = event.dataTransfer.getData("text/plain");
  if (!word || !CONFIG.finalWords.includes(word)) return;
  // Move an existing word if dropped onto an occupied slot.
  const existing = wordSlots[index];
  const oldIndex = wordSlots.indexOf(word);
  if (oldIndex !== -1) wordSlots[oldIndex] = existing;
  wordSlots[index] = word;
  updateWordBank();
}
function checkWordOrder() {
  const feedback = document.getElementById("finalFeedback");
  const firstSix = wordSlots.slice(0, 6);
  if (firstSix.some(w => !w)) {
    feedback.textContent = "All six positions must be filled before verification.";
    feedback.className = "feedback bad";
    return;
  }
  const correct = CONFIG.finalWords.every((w, i) => firstSix[i] === w);
  if (!correct) {
    feedback.textContent = "Message sequence not verified. Re-examine the evidence.";
    feedback.className = "feedback bad";
    return;
  }
  finalChecked = true;
  feedback.textContent = "MESSAGE VERIFIED. FINAL POSITION UNLOCKED.";
  feedback.className = "feedback good";
  wordSlots[6] = null;
  updateWordBank();
  showEmojiChoices();
}
function showEmojiChoices() {
  document.getElementById("emojiStage").innerHTML = `
    <section class="reward">
      <div class="eyebrow">FINAL IDENTIFICATION REQUIRED</div>
      <h2 class="gold">One final emoji remains.</h2>
      <p>Based on all available evidence, select the emoji that completes the message.</p>
      <div class="slots">
        <div class="slot filled">${CONFIG.finalWords[0]}</div>
        <div class="slot filled">${CONFIG.finalWords[1]}</div>
        <div class="slot filled">${CONFIG.finalWords[2]}</div>
        <div class="slot filled">${CONFIG.finalWords[3]}</div>
        <div class="slot filled">${CONFIG.finalWords[4]}</div>
        <div class="slot filled">${CONFIG.finalWords[5]}</div>
        <div class="slot" id="seventhSlot">?</div>
      </div>
      <div class="emoji-options">
        ${CONFIG.emojiChoices.map(e => `
          <button class="emoji-choice" onclick="selectEmoji('${e}')" aria-label="Select ${e}">${e}</button>
        `).join("")}
      </div>
      <div id="emojiFeedback" class="feedback"></div>
    </section>
  `;
}
function selectEmoji(emoji) {
  const feedback = document.getElementById("emojiFeedback");
  if (emoji === "🐑") {
    wordSlots[6] = emoji;
    progress.finalComplete = true;
    saveProgress();
    celebrate();
    setTimeout(finalReveal, 1000);
  } else {
    feedback.textContent = "That emoji does not complete the message. Investigate further.";
    feedback.className = "feedback bad";
  }
}
// ============================================================
// CELEBRATION AND FINAL REPORT
// ============================================================
function celebrate() {
  const container = document.getElementById("confetti");
  const pieces = 120;
  for (let i = 0; i < pieces; i++) {
    const el = document.createElement("div");
    el.className = "confetti-piece";
    el.style.left = Math.random() * 100 + "%";
    el.style.background = ["#d2b27d", "#f3eee4", "#8eaa9b", "#a75d58"][i % 4];
    el.style.animationDelay = Math.random() * 1.2 + "s";
    el.style.transform = "rotate(" + Math.random() * 360 + "deg)";
    container.appendChild(el);
    setTimeout(() => el.remove(), 5000);
  }
}
function finalReveal() {
  showScreen(`
    <section class="final-banner">
      <div class="eyebrow">N.O.E.L. // FINAL REPORT</div>
      <div class="big-sheep">🐑</div>
      <h1 class="gold">CHRISTMAS RESTORED.</h1>
      <p style="font-size:22px">All I want for Christmas is <strong class="gold">EWE.</strong></p>
      <p>All six investigations have been completed. The missing emoji has been identified and the festive situation is now under control.</p>
      <p class="eyebrow">THANK YOU, AGENT.</p>
      <button class="btn" onclick="finalSummary()">View final case report</button>
    </section>
  `, "reveal");
}
function finalSummary() {
  const summaries = CONFIG.operations.map((op, i) => `
    <div class="summary-case">
      <div class="eyebrow">CASE FILE 00${i + 1}</div>
      <h3>${op.emoji} ${op.title}</h3>
      <div class="experience"><strong>LOST // ${op.lost.destination}</strong>${op.experiences.lost}</div>
      <div class="experience"><strong>FOUND // ${op.found.destination}</strong>${op.experiences.found}</div>
      <div class="small">RECOVERED WORD: <span class="gold">${op.codeWord}</span></div>
    </div>
  `).join("");
  showScreen(`
    <div class="toolbar">
      <button class="back" onclick="dashboard()">← OPERATIONS DASHBOARD</button>
      <span class="eyebrow">FINAL REPORT // DECLASSIFIED</span>
    </div>
    <div class="eyebrow">NATIONAL OFFICE OF EMOJI LIAISON</div>
    <h1 class="gold">Mission accomplished.</h1>
    <p>Agent ${CONFIG.agentId}, the following operations have been successfully concluded. The destination experiences are recorded below.</p>
    <div class="panel">
      <div class="eyebrow">FINAL MESSAGE</div>
      <h2>ALL I WANT FOR CHRISTMAS IS 🐑</h2>
      <p>All cases resolved. Christmas restored. Ewe identified.</p>
    </div>
    <h2>Resolved operations</h2>
    ${summaries}
    <div class="reward">
      <h2 class="gold">N.O.E.L. thanks you for your service.</h2>
      <p>Have a wonderful Christmas.</p>
    </div>
  `, "summary");
}
// ============================================================
// RESET / STARTUP
// ============================================================
function resetProgress() {
  if (!confirm("Reset all N.O.E.L. progress on this browser? This cannot be undone.")) return;
  progress = freshProgress();
  saveProgress();
  currentOperation = null;
  goLogin();
}
function start() {
  if (progress.loggedIn) {
    dashboard();
  } else {
    goLogin();
  }
}
start();
</script>
